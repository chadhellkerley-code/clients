<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico de Negocio</title>
<style>
  :root{
    --bg:#0c0b09;
    --bg-raised:#161310;
    --card:#18150f;
    --line:#2c2820;
    --mustard:#e3b323;
    --mustard-dim:#b8901d;
    --mustard-soft:#f0c94f;
    --text:#efe8d8;
    --muted:#9c9382;
    --err:#e07a63;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);

    -webkit-font-smoothing:antialiased;
  }
  .serif-em{

  .topbar-progress{flex:1; max-width:360px; min-width:180px;}
  .progress-track{height:5px; background:var(--line); border-radius:3px; overflow:hidden;}

    background:none; border:1px solid var(--line); color:var(--muted);
    padding:8px 14px; font-size:13px; border-radius:5px; cursor:pointer; font-family:inherit;
  }
  .topbar-btn:hover{border-color:var(--mustard-dim); color:var(--mustard-soft);}
  .topbar-email{font-size:12.5px; color:var(--muted);}

  .center-screen{
    flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px;
  }
  .auth-box{max-width:420px; width:100%;}
  .auth-eyebrow{color:var(--mustard); font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; margin:0 0 10px;}
  .auth-title{font-size:26px; margin:0 0 14px; line-height:1.25;}
  .auth-copy{font-size:14.5px; color:var(--muted); line-height:1.6; margin:0 0 22px;}

    width:100%; border:1px solid var(--line); border-radius:6px; background:var(--card);

  }
  input[type=email]:focus{outline:none; border-color:var(--mustard-dim);}
  .primary-btn{
    background:var(--mustard); color:#1a1509; border:none; padding:13px 22px;

  .primary-btn:disabled{opacity:.4; cursor:default;}
  .auth-error{color:var(--err); font-size:13.5px; margin-top:10px;}
  .auth-note{font-size:12.5px; color:var(--muted); margin-top:16px; line-height:1.5;}

  .q-num{font-size:11.5px; color:var(--mustard); letter-spacing:.05em; margin-bottom:8px;}
  .q-text{font-size:16px; margin:0 0 4px; line-height:1.45; color:var(--text);}
  .q-hint{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif; font-style:italic; font-size:13.5px; color:var(--muted); margin:0 0 10px;}
  .q-locked-answer{font-size:14.5px; color:var(--text); white-space:pre-wrap; line-height:1.5; padding-top:4px;}

  table.grid th{text-align:left; font-size:11.5px; color:var(--muted); font-weight:600; padding:4px 8px; border-bottom:1px solid var(--line);}
  table.grid td{padding:3px 4px; vertical-align:top;}

    .topbar-progress{max-width:none; width:100%;}

  }
</style>
</head>

/* ---------------- Fingerprint ---------------- */
async function getFingerprint(){
  const raw = [
    navigator.userAgent, navigator.language,
    screen.width+"x"+screen.height,
    Intl.DateTimeFormat().resolvedOptions().timeZone,
    navigator.hardwareConcurrency, navigator.platform
  ].join("|");
  const enc = new TextEncoder().encode(raw);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

/* ---------------- Auth screens ---------------- */
function renderCentered(html){
  main.style.display = "none";
  topbar.style.display = "none";
  centerScreen.style.display = "flex";
  centerScreen.innerHTML = html;
}

function renderLogin(errorMsg){
  renderCentered(`
    <div class="auth-box">
      <div class="auth-eyebrow">Antes de empezar</div>
      <h1 class="auth-title">Ingresá tu email para acceder al diagnóstico</h1>
      <p class="auth-copy">Te vamos a mandar un link para entrar, sin contraseña.</p>
      <input type="email" id="emailInput" placeholder="tu@email.com" autocomplete="email">
      <button class="primary-btn" id="sendLinkBtn">Enviarme el link de acceso</button>
      ${errorMsg ? `<div class="auth-error">${errorMsg}</div>` : ""}
    </div>
  `);
  document.getElementById("sendLinkBtn").onclick = async ()=>{
    const email = document.getElementById("emailInput").value.trim();
    if(!email || !email.includes("@")){ renderLogin("Escribí un email válido."); return; }
    const btn = document.getElementById("sendLinkBtn");
    btn.disabled = true; btn.textContent = "Enviando…";
    try{
      const actionCodeSettings = { url: window.location.href, handleCodeInApp: true };
      await sendSignInLinkToEmail(auth, email, actionCodeSettings);
      window.localStorage.setItem(EMAIL_STORAGE_KEY, email);
      renderCheckEmail(email);
    }catch(e){
      console.error(e);
      renderLogin("No pudimos enviar el link. Probá de nuevo en un momento.");
    }
  };
}

      <div class="auth-eyebrow">Revisá tu bandeja de entrada</div>
      <h1 class="auth-title">Te mandamos un link a <span class="serif-em">${email}</span></h1>
      <p class="auth-copy">Abrilo desde este mismo navegador para entrar. Si no lo ves en unos minutos, revisá spam.</p>
    </div>
  `);
}

function renderBlocked(){
  renderCentered(`
    <div class="auth-box">
      <div class="auth-eyebrow">Este navegador ya fue usado</div>
      <h1 class="auth-title">Ya se inició un diagnóstico desde este dispositivo con otra cuenta</h1>
      <p class="auth-copy">Si sos vos y ya empezaste antes, entrá con el mismo email que usaste la primera vez. Si creés que es un error, escribile directamente a la persona que te compartió este link.</p>
      <button class="primary-btn" id="logoutBlockedBtn">Salir e intentar con otro email</button>
    </div>
  `);
  document.getElementById("logoutBlockedBtn").onclick = ()=> signOut(auth);
}

/* ---------------- Guardado ---------------- */
function scheduleSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await updateDoc(docRef, {
        answers: state.answers,
        viewMode: state.viewMode,
        currentSection: state.currentSection,
        furthestSection: state.furthestSection,
        updatedAt: serverTimestamp(),
      });
      showToast("Guardado");
    }catch(e){ console.error("No se pudo guardar", e); }
  }, 500);
}

function isAnswered(q){
  const v = state.answers[q.id];
  if(!v) return false;
  if(q.table) return Array.isArray(v) && v.some(row=>Object.values(row).some(c=>(c||"").trim()!==""));
  return typeof v === "string" && v.trim()!=="";
}
function countAnsweredInSection(s){ return s.questions.filter(isAnswered).length; }
function countAnsweredTotal(){ return SECTIONS.reduce((n,s)=>n+countAnsweredInSection(s),0); }

function updateProgress(){
  const total = countAnsweredTotal();
  document.getElementById("progressFill").style.width = (total/TOTAL_QUESTIONS*100)+"%";
  document.getElementById("progressLabel").textContent = `${total} de ${TOTAL_QUESTIONS} respondidas`;
}

/* ---------------- Intro (audio + transcripción) ---------------- */
function checkUnlockAndUpdate(){
  const dotA = document.getElementById("dotAudio"), dotR = document.getElementById("dotRead");
  const btn = document.getElementById("continueBtn");
  if(!btn) return;
  if(dotA) dotA.classList.toggle("on", unlockState.audioDone);
  if(dotR) dotR.classList.toggle("on", unlockState.readDone);
  btn.disabled = !(unlockState.audioDone || unlockState.readDone);
}
function evaluateReadProgress(){
  if(unlockState.readDone) return;
  const elapsed = transcriptOpenedAt ? (Date.now()-transcriptOpenedAt) : 0;
  if(transcriptScrolledToEnd && elapsed >= MIN_READ_MS){
    unlockState.readDone = true; checkUnlockAndUpdate();
    if(transcriptTimerId){ clearInterval(transcriptTimerId); transcriptTimerId = null; }
  }
}

function renderIntro(){
  topbar.style.display = "none";
  centerScreen.style.display = "none";
  main.style.display = "block";
  main.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "intro-wrap";
  wrap.innerHTML = `
    <div class="intro-eyebrow">Antes de empezar</div>
    <h1 class="intro-title">Un mensaje corto antes del diagnóstico</h1>
    <div class="audio-card">
      <div class="audio-label">Escuchá esto (1:35)</div>
      <audio controls preload="auto" src="${AUDIO_URL}"></audio>
      <div class="audio-status" id="audioStatus">Todavía no escuchaste el audio completo.</div>
      <button class="transcript-toggle" id="transcriptToggle">¿No podés escucharlo ahora? Leé la transcripción</button>
      <div class="transcript-block" id="transcriptBlock" style="display:none;">
        ${TRANSCRIPT_PARAGRAPHS.map(p=>`<p>${p}</p>`).join("")}
        <div class="transcript-end-marker" id="transcriptEndMarker"></div>
      </div>
    </div>
    <div class="unlock-status"><span class="unlock-dot" id="dotAudio"></span> Escuchaste el audio completo</div>
    <div class="unlock-status"><span class="unlock-dot" id="dotRead"></span> Leíste la transcripción completa</div>
    <button class="continue-btn" id="continueBtn" disabled>Continuar al diagnóstico →</button>
    <div class="continue-hint">Escuchá el audio o leé el mensaje completo para continuar.</div>
  `;
  main.appendChild(wrap);

  const audioEl = wrap.querySelector("audio");
  const audioStatus = document.getElementById("audioStatus");
  const markAudioDone = ()=>{
    if(unlockState.audioDone) return;
    unlockState.audioDone = true;
    audioStatus.textContent = "Audio escuchado. ✓"; audioStatus.classList.add("ok");
    checkUnlockAndUpdate();
  };
  audioEl.addEventListener("timeupdate", ()=>{
    if(audioEl.duration && audioEl.currentTime/audioEl.duration >= 0.9) markAudioDone();
  });
  audioEl.addEventListener("ended", markAudioDone);

  const toggle = document.getElementById("transcriptToggle");
  const block = document.getElementById("transcriptBlock");
  const endMarker = document.getElementById("transcriptEndMarker");
  let observer = null;
  toggle.onclick = ()=>{
    const opening = block.style.display === "none";
    block.style.display = opening ? "block" : "none";
    toggle.textContent = opening ? "Ocultar transcripción" : "¿No podés escucharlo ahora? Leé la transcripción";
    if(opening){
      if(!transcriptOpenedAt) transcriptOpenedAt = Date.now();
      if(!transcriptTimerId) transcriptTimerId = setInterval(evaluateReadProgress, 1000);
      if(!observer){
        observer = new IntersectionObserver((entries)=>{
          entries.forEach(e=>{ if(e.isIntersecting) transcriptScrolledToEnd = true; });
          evaluateReadProgress();
        }, { root: block, threshold: 0.9 });
        observer.observe(endMarker);
      }
    }
  };
  document.getElementById("continueBtn").onclick = (e)=>{
    if(e.target.disabled) return;
    state.viewMode = "form"; state.currentSection = 0;
    scheduleSave(); render(); window.scrollTo(0,0);
  };
  checkUnlockAndUpdate();
}

/* ---------------- Tablas y preguntas ---------------- */
function ensureTableData(q){
  if(!state.answers[q.id] || !Array.isArray(state.answers[q.id])){
    state.answers[q.id] = q.prefill
      ? q.prefill.map(label=>{ const row={}; q.cols.forEach(c=>row[c.key]=""); row[q.cols[0].key]=label; return row; })
      : [ Object.fromEntries(q.cols.map(c=>[c.key,""])) ];
  }
  return state.answers[q.id];
}

function renderTable(q, locked){
  const rows = ensureTableData(q);
  const wrap = document.createElement("div");
  const table = document.createElement("table");
  table.className = "grid";
  const thead = document.createElement("tr");
  q.cols.forEach(c=>{ const th=document.createElement("th"); th.textContent=c.label; thead.appendChild(th); });
  thead.appendChild(document.createElement("th"));
  table.appendChild(thead);
  rows.forEach((row, ri)=>{
    const tr = document.createElement("tr");
    q.cols.forEach(c=>{
      const td = document.createElement("td");
      const input = document.createElement("input");
      input.value = row[c.key] || "";
      input.disabled = locked;
      input.oninput = (e)=>{ rows[ri][c.key]=e.target.value; scheduleSave(); updateProgress(); };
      td.appendChild(input); tr.appendChild(td);
    });
    const tdBtn = document.createElement("td");
    if(rows.length>1 && !q.prefill && !locked){
      const rm = document.createElement("button");
      rm.className = "rm-row"; rm.textContent = "✕";
      rm.onclick = ()=>{ rows.splice(ri,1); scheduleSave(); renderMain(); };
      tdBtn.appendChild(rm);
    }
    tr.appendChild(tdBtn); table.appendChild(tr);
  });
  wrap.appendChild(table);
  if(!q.prefill && !locked){
    const actions = document.createElement("div");
    actions.className = "row-actions";
    const addBtn = document.createElement("button");
    addBtn.className = "add-row"; addBtn.textContent = "+ agregar fila";
    addBtn.onclick = ()=>{ rows.push(Object.fromEntries(q.cols.map(c=>[c.key,""]))); scheduleSave(); renderMain(); };
    actions.appendChild(addBtn); wrap.appendChild(actions);
  }
  return wrap;
}

function renderQuestion(q, locked){
  const box = document.createElement("div");
  box.className = "q"; box.id = "box-"+q.id;
  box.innerHTML = `<div class="q-num">PREGUNTA ${q.id.replace("q","")}</div><p class="q-text">${q.text}</p>${q.hint?`<p class="q-hint">${q.hint}</p>`:""}`;
  if(q.table){
    box.appendChild(renderTable(q, locked));
  }else if(locked){
    const val = state.answers[q.id];
    const div = document.createElement("div");
    div.className = "q-locked-answer" + (val && val.trim() ? "" : " empty");
    div.textContent = val && val.trim() ? val : "Sin responder.";
    box.appendChild(div);
  }else{
    const ta = document.createElement("textarea");
    ta.value = state.answers[q.id] || "";
    ta.placeholder = "Escribí la respuesta acá… si no lo sabés, escribí que no lo sabés.";
    ta.oninput = (e)=>{
      state.answers[q.id] = e.target.value;
      scheduleSave(); updateProgress();
      if(e.target.value.trim()!=="") box.classList.remove("invalid");
    };
    box.appendChild(ta);
    const err = document.createElement("div");
    err.className = "q-error";
    err.textContent = "Esta pregunta necesita una respuesta antes de avanzar — si no lo sabés, escribilo así.";
    box.appendChild(err);
  }
  return box;
}

function renderFormSection(){
  main.innerHTML = "";
  const section = SECTIONS[state.currentSection];
  const locked = state.currentSection < state.furthestSection;
  const eyebrow = document.createElement("div");
  eyebrow.className = "section-eyebrow";
  eyebrow.textContent = `SECCIÓN ${state.currentSection+1} DE ${SECTIONS.length}`;
  main.appendChild(eyebrow);
  const h1 = document.createElement("h1");
  h1.className = "section-title"; h1.textContent = section.title;
  main.appendChild(h1);
  const intro = document.createElement("p");
  intro.className = "section-intro"; intro.textContent = section.intro;
  main.appendChild(intro);
  if(locked){
    const banner = document.createElement("div");
    banner.className = "locked-banner";
    banner.textContent = "Esta sección ya la completaste y quedó guardada. No se puede volver a editar.";
    main.appendChild(banner);
  }
  section.questions.forEach(q=> main.appendChild(renderQuestion(q, locked)));

  const nav = document.createElement("div");
  nav.className = "nav-buttons";
  const prevBtn = document.createElement("button");
  prevBtn.className = "navbtn ghost"; prevBtn.textContent = "← Sección anterior";
  prevBtn.disabled = state.currentSection === 0;
  prevBtn.onclick = ()=>{ state.currentSection--; render(); window.scrollTo(0,0); };
  const nextBtn = document.createElement("button");
  const isLast = state.currentSection === SECTIONS.length-1;
  nextBtn.className = "navbtn";
  nextBtn.textContent = locked ? "Siguiente →" : (isLast ? "Ver resumen completo →" : "Siguiente sección →");
  nextBtn.onclick = ()=>{
    if(!locked){
      const missing = section.questions.filter(q=>!q.table && !isAnswered(q));
      if(missing.length>0){
        missing.forEach(q=>{ const b=document.getElementById("box-"+q.id); if(b) b.classList.add("invalid"); });
        document.getElementById("box-"+missing[0].id)?.scrollIntoView({behavior:"smooth", block:"center"});
        return;
      }
      if(state.currentSection === state.furthestSection && state.furthestSection < SECTIONS.length-1){
        state.furthestSection++;
      }
    }
    if(isLast){ state.viewMode = "summary"; }
    else state.currentSection++;
    scheduleSave(); render(); window.scrollTo(0,0);
  };
  nav.appendChild(prevBtn); nav.appendChild(nextBtn);
  main.appendChild(nav);
}

function renderSummary(){
  main.innerHTML = "";
  main.innerHTML = `<div class="section-eyebrow">RESUMEN</div><h1 class="section-title">Diagnóstico completo</h1><p class="section-intro">Esto es lo que vas a tener enfrente antes de la llamada.</p>`;
  const wrap = document.createElement("div"); wrap.className = "summary";
  SECTIONS.forEach(s=>{
    const h2 = document.createElement("h2"); h2.textContent = s.title; wrap.appendChild(h2);
    s.questions.forEach(q=>{
      const qa = document.createElement("div"); qa.className = "qa";
      qa.innerHTML = `<div class="qq">${q.text}</div>`;
      if(q.table){
        const rows = (state.answers[q.id]||[]).filter(r=>Object.values(r).some(v=>(v||"").trim()!==""));
        if(rows.length===0){
          qa.innerHTML += `<div class="aa empty">Sin datos aún.</div>`;
        }else{
          const table = document.createElement("table");
          const thead = document.createElement("tr");
          q.cols.forEach(c=>{ const th=document.createElement("th"); th.textContent=c.label; thead.appendChild(th); });
          table.appendChild(thead);
          rows.forEach(r=>{
            const tr = document.createElement("tr");
            q.cols.forEach(c=>{ const td=document.createElement("td"); td.textContent=r[c.key]||""; tr.appendChild(td); });
            table.appendChild(tr);
          });
          qa.appendChild(table);
        }
      }else{
        const val = state.answers[q.id];
        qa.innerHTML += `<div class="aa ${val && val.trim() ? "" : "empty"}">${val && val.trim() ? val : "Sin responder aún."}</div>`;
      }
      wrap.appendChild(qa);
    });
  });
  main.appendChild(wrap);
  const nav = document.createElement("div"); nav.className = "nav-buttons";
  const backBtn = document.createElement("button");
  backBtn.className = "navbtn ghost"; backBtn.textContent = "← Volver";
  backBtn.onclick = ()=>{ state.viewMode="form"; state.currentSection = Math.min(state.furthestSection, SECTIONS.length-1); render(); window.scrollTo(0,0); };
  nav.appendChild(backBtn); main.appendChild(nav);
}

function renderMain(){
  topbar.style.display = "flex";
  centerScreen.style.display = "none";
  main.style.display = "block";
  updateProgress();
  document.getElementById("topbarEmail").textContent = currentUser ? currentUser.email : "";
  if(state.viewMode === "summary") renderSummary();
  else renderFormSection();
}

function render(){
  if(state.viewMode === "login") renderLogin();
  else if(state.viewMode === "check-email") return; // ya renderizado
  else if(state.viewMode === "blocked") renderBlocked();
  else if(state.viewMode === "intro") renderIntro();
  else renderMain();
}

document.getElementById("viewSummaryBtn").onclick = ()=>{ state.viewMode="summary"; render(); window.scrollTo(0,0); };
document.getElementById("logoutBtn").onclick = ()=> signOut(auth);

/* ---------------- Arranque de sesión ---------------- */
async function afterLogin(user){
  currentUser = user;
  const fp = await getFingerprint();
  const lockRef = doc(db, "device_locks", fp);
  const lockSnap = await getDoc(lockRef);
  if(lockSnap.exists() && lockSnap.data().uid !== user.uid){
    state.viewMode = "blocked"; render(); return;
  }
  if(!lockSnap.exists()){
    try{ await setDoc(lockRef, { uid:user.uid, email:user.email, createdAt: serverTimestamp() }); }
    catch(e){ console.warn("No se pudo registrar el dispositivo", e); }
  }

  docRef = doc(db, "respuestas", user.uid);
  const snap = await getDoc(docRef);
  if(!snap.exists()){
    await setDoc(docRef, {
      email: user.email, createdAt: serverTimestamp(), updatedAt: serverTimestamp(),
      viewMode: "intro", currentSection: 0, furthestSection: 0, answers: {}
    });
    state.viewMode = "intro"; state.currentSection = 0; state.furthestSection = 0; state.answers = {};
  }else{
    const d = snap.data();
    state.answers = d.answers || {};
    state.currentSection = d.currentSection || 0;
    state.furthestSection = d.furthestSection || 0;
    state.viewMode = ["intro","form","summary"].includes(d.viewMode) ? d.viewMode : "intro";
  }
  render();
}

onAuthStateChanged(auth, async (user)=>{
  if(user){
    if(ADMIN_EMAILS.includes((user.email||"").toLowerCase())){
      window.location.replace("/admin");
      return;
    }
    await afterLogin(user);
  }else{
    if(isSignInWithEmailLink(auth, window.location.href)){
      let email = window.localStorage.getItem(EMAIL_STORAGE_KEY);
      if(!email){
        email = window.prompt("Confirmá tu email para completar el ingreso:");
      }
      try{
        const result = await signInWithEmailLink(auth, email, window.location.href);
        window.localStorage.removeItem(EMAIL_STORAGE_KEY);
        window.history.replaceState({}, document.title, window.location.pathname);
        // onAuthStateChanged se vuelve a disparar con el user ya logueado
      }catch(e){
        console.error(e);
        state.viewMode = "login"; render();
      }
    }else{
      state.viewMode = "login"; render();
    }
  }
});
</script>
